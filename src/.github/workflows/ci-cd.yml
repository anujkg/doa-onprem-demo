# DOA Application — Azure Container Apps CI/CD Pipeline
# Builds, tests, pushes to ACR, and deploys to Azure Container Apps

name: DOA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_REGISTRY: acrdoaprod.azurecr.io
  IMAGE_NAME_WEB: doa/webapp
  IMAGE_NAME_BATCH: doa/batch-jobs
  AZURE_CONTAINER_APP_WEB: ca-doa-web-prod
  AZURE_CONTAINER_APP_BATCH: caj-doa-batch-prod
  RESOURCE_GROUP: rg-doa-prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC — no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name acrdoaprod

      - name: Build & Push Web App
        run: |
          docker build -f src/Dockerfile \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest \
            src/
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}

      - name: Build & Push Batch Jobs
        run: |
          docker build -f src/Dockerfile.batch \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_BATCH }}:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_BATCH }}:latest \
            src/
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_BATCH }}:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web App to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_WEB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}

      - name: Update Batch Job image
        run: |
          az containerapp job update \
            --name ${{ env.AZURE_CONTAINER_APP_BATCH }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME_BATCH }}:${{ github.sha }}

      - name: Verify Web App health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_WEB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionFqdn" -o tsv)
          for i in $(seq 1 10); do
            if curl -sf "https://${FQDN}/healthz"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${i}/10 failed, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1
