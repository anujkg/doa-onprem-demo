apiVersion: apps/v1
kind: Deployment
metadata:
  name: doa-webapp
  namespace: doa-production
  labels:
    app: doa-webapp
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: doa-webapp
  template:
    metadata:
      labels:
        app: doa-webapp
        tier: frontend
    spec:
      containers:
        - name: doa-webapp
          image: harbor.doa.local/doa/webapp:2.4.1
          ports:
            - containerPort: 8080
          env:
            # ⚠️ Secrets in environment variables — not using K8s Secrets or a vault
            - name: ConnectionStrings__SqlServer
              value: "Server=sqlprod01.doa.local;Database=DOA_Orders;User Id=doa_app;Password=Pr0d!Pass#2024;TrustServerCertificate=true"
            - name: Ldap__Server
              value: "ldap://dc01.doa.local"
            - name: Ldap__Port
              value: "389"
            - name: Ldap__BaseDN
              value: "DC=doa,DC=local"
            - name: Ldap__ServiceAccount
              value: "CN=svc_ldap_reader,OU=ServiceAccounts,DC=doa,DC=local"
            - name: Ldap__ServicePassword
              value: "LdapR3ader!2024"
            - name: Smtp__Host
              value: "smtp.doa.local"
            - name: Smtp__Port
              value: "25"
            - name: Ssrs__ServerUrl
              value: "http://ssrs01.doa.local/ReportServer"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # ⚠️ No health checks configured — no readiness/liveness probes
      # ⚠️ Running as root (no securityContext)
---
apiVersion: v1
kind: Service
metadata:
  name: doa-webapp-svc
  namespace: doa-production
spec:
  type: ClusterIP
  selector:
    app: doa-webapp
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
# ⚠️ Ingress routes through F5 load balancer (external to K8s)
# F5 VIP: 10.0.100.50 → forwards to NodePort 30080
apiVersion: v1
kind: Service
metadata:
  name: doa-webapp-nodeport
  namespace: doa-production
spec:
  type: NodePort
  selector:
    app: doa-webapp
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
